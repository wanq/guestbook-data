name: Trigger WB Checkin

on:
  schedule:
    - cron: '25 23 * * *'
    - cron: '25 0 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch wb-checkin workflow
        run: |
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.WB_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wanq/wb-checkin/actions/workflows/checkin-daily.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "Response: $code"
          test "$code" = "204"
